<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub - Modern LMS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#22d3ee', // cyan-400
                            500: '#06b6d4', // cyan-500
                            600: '#0891b2',
                            glow: '#22d3ee',
                        },
                        admin: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        },
                        dark: {
                            bg: '#020617', // slate-950
                            surface: '#0f172a', // slate-900
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Styles */
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        
        /* Glassmorphism High Definition */
        .glass {
            background: rgba(15, 23, 42, 0.60);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-panel {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.6) 100%);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #22d3ee;
            margin-top: -4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }
        
        /* Utility */
        .neon-text { text-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
        .neon-text-purple { text-shadow: 0 0 10px rgba(167, 139, 250, 0.5); }
        
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden selection:bg-brand-500 selection:text-white relative">

    <!-- Global Background Ambience -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-20%] right-[-10%] w-[60vw] h-[60vw] bg-indigo-900/10 rounded-full blur-[150px]"></div>
        <div class="absolute bottom-[-20%] left-[-10%] w-[60vw] h-[60vw] bg-cyan-900/5 rounded-full blur-[150px]"></div>
    </div>

    <div id="app" class="h-full w-full flex flex-col relative z-10"></div>

    <script>
        /**
         * LearnHub LMS - Single File Architecture
         */
        const APP = {
            CONSTANTS: {
                DB_NAME: 'LearnHub_DB',
                DB_VERSION: 2, 
                STORE_FILES: 'files',
                STORE_DATA: 'data'
            },

            state: {
                user: null, 
                isLoading: true,
                adminTab: 'courses', 
                activeVideoUrl: null,
                activeLessonId: null,
                autoplay: true
            },

            data: {
                courses: [], 
                users: [],
                progress: {}, 
                activity: [] 
            },

            db: {
                instance: null,
                async init() {
                    return new Promise((resolve, reject) => {
                        const request = indexedDB.open(APP.CONSTANTS.DB_NAME, APP.CONSTANTS.DB_VERSION);
                        request.onerror = (e) => reject('DB Error');
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(APP.CONSTANTS.STORE_FILES)) db.createObjectStore(APP.CONSTANTS.STORE_FILES);
                            if (!db.objectStoreNames.contains(APP.CONSTANTS.STORE_DATA)) db.createObjectStore(APP.CONSTANTS.STORE_DATA);
                        };
                        request.onsuccess = (e) => {
                            APP.db.instance = e.target.result;
                            resolve(APP.db.instance);
                        };
                    });
                },
                async saveFile(id, blob) {
                    return APP.db.op(APP.CONSTANTS.STORE_FILES, 'readwrite', (store) => store.put(blob, id));
                },
                async getFile(id) {
                    return APP.db.op(APP.CONSTANTS.STORE_FILES, 'readonly', (store) => store.get(id));
                },
                async saveData() {
                    return APP.db.op(APP.CONSTANTS.STORE_DATA, 'readwrite', (store) => store.put(APP.data, 'main_data'));
                },
                async loadData() {
                    try {
                        const data = await APP.db.op(APP.CONSTANTS.STORE_DATA, 'readonly', (store) => store.get('main_data'));
                        if (data) APP.data = data;
                        else APP.services.seedData();
                        
                        if(!APP.data.users) {
                            APP.data.users = [
                                { name: 'Administrator', email: 'admin@learnhub.com', role: 'admin', password: 'admin' },
                                { name: 'Demo Student', email: 'student@learnhub.com', role: 'student', password: 'student' }
                            ];
                        }
                    } catch (e) { APP.services.seedData(); }
                },
                async clearAll() {
                     const tx = APP.db.instance.transaction([APP.CONSTANTS.STORE_FILES, APP.CONSTANTS.STORE_DATA], 'readwrite');
                     tx.objectStore(APP.CONSTANTS.STORE_FILES).clear();
                     tx.objectStore(APP.CONSTANTS.STORE_DATA).clear();
                     return new Promise(resolve => tx.oncomplete = resolve);
                },
                op(storeName, mode, callback) {
                    return new Promise((resolve, reject) => {
                        const tx = APP.db.instance.transaction(storeName, mode);
                        const store = tx.objectStore(storeName);
                        const request = callback(store);
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                }
            },

            services: {
                seedData() {
                    APP.data.courses = [
                        {
                            id: 'c1',
                            title: 'Full Stack Web Development',
                            description: 'Master the MERN stack with 50+ real world projects. Code with excellence.',
                            batch: 'LearnHub 1.0',
                            thumbnail: 'https://images.unsplash.com/photo-1593720213428-28a5b9e94613?q=80&w=2070&auto=format&fit=crop',
                            modules: [
                                {
                                    id: 'm1',
                                    title: 'Introduction & Setup',
                                    lessons: [
                                        { id: 'l1', title: 'Course Orientation', type: 'video', duration: '12:00' },
                                        { id: 'l2', title: 'VS Code Setup', type: 'pdf', duration: 'Read' }
                                    ]
                                }
                            ]
                        }
                    ];
                    APP.data.users = [
                        { name: 'Administrator', email: 'admin@learnhub.com', role: 'admin', password: 'admin' },
                        { name: 'Demo Student', email: 'student@learnhub.com', role: 'student', password: 'student' }
                    ];
                },

                login(username, password, role) {
                    const user = APP.data.users.find(u => (u.email === username || u.name === username) && u.password === password && u.role === role);
                    if (user) {
                        APP.state.user = user;
                        APP.router.navigate(role === 'admin' ? 'admin' : 'dashboard');
                        APP.notify(`Welcome back, ${user.name}!`, 'success');
                    } else {
                        APP.notify('Invalid credentials', 'error');
                    }
                },

                async importFilesToCourse(courseId, fileList) {
                    const files = Array.from(fileList);
                    const courseIndex = APP.data.courses.findIndex(c => c.id === courseId);
                    
                    if (courseIndex === -1) {
                        APP.notify('Error: Course not found.', 'error');
                        return;
                    }

                    let processedCount = 0;
                    APP.notify('Importing files... Do not close the tab.', 'info');

                    const moduleMap = {}; 

                    const promises = files.map(async (file) => {
                        const pathParts = file.webkitRelativePath.split('/');
                        let moduleName = "Imported Content";
                        let fileName = file.name;

                        if (pathParts.length > 1) {
                            moduleName = pathParts[pathParts.length - 2];
                        }

                        if (fileName.startsWith('.')) return;

                        const moduleId = 'm_' + courseId + '_' + moduleName.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                        
                        if (!moduleMap[moduleId]) {
                            moduleMap[moduleId] = {
                                id: moduleId,
                                title: moduleName,
                                lessons: []
                            };
                        }

                        const lessonId = 'l_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        
                        const ext = fileName.split('.').pop().toLowerCase();
                        let type = 'file';
                        if (file.type.startsWith('video') || ['mp4', 'webm', 'ogg', 'mov', 'mkv'].includes(ext)) type = 'video';
                        else if (file.type === 'application/pdf' || ext === 'pdf') type = 'pdf';

                        await APP.db.saveFile(lessonId, file);

                        moduleMap[moduleId].lessons.push({
                            id: lessonId,
                            title: fileName,
                            type: type,
                            duration: 'View'
                        });

                        processedCount++;
                    });

                    try {
                        await Promise.all(promises);
                        const course = APP.data.courses[courseIndex];
                        Object.values(moduleMap).forEach(newMod => {
                            const existingMod = course.modules.find(m => m.title === newMod.title);
                            if (existingMod) {
                                existingMod.lessons.push(...newMod.lessons);
                            } else {
                                course.modules.push(newMod);
                            }
                        });

                        await APP.db.saveData();
                        APP.notify(`Success! Imported ${processedCount} files.`, 'success');
                        APP.router.navigate(`admin/course/${courseId}`);
                    } catch (err) {
                        console.error(err);
                        APP.notify('Import failed. Check console for details.', 'error');
                    }
                },

                exportData() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(APP.data));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    downloadAnchorNode.setAttribute("download", "learnhub_backup.json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                },

                async importData(file) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const json = JSON.parse(e.target.result);
                            APP.data = json;
                            await APP.db.saveData();
                            APP.notify('Data restored successfully', 'success');
                            location.reload();
                        } catch (err) {
                            APP.notify('Invalid JSON file', 'error');
                        }
                    };
                    reader.readAsText(file);
                }
            },

            ui: {
                renderThumbnail(src, className = '') {
                    if (src && (src.startsWith('http') || src.startsWith('data:') || src.startsWith('/'))) {
                        return `<img src="${src}" class="w-full h-full object-cover ${className}" alt="Thumbnail">`;
                    }
                    return `<div class="w-full h-full flex items-center justify-center bg-slate-800 ${className}"><i class="fas ${src || 'fa-cube'} text-slate-500"></i></div>`;
                }
            },

            router: {
                routes: {
                    'selection': () => APP.components.Selection(),
                    'login/student': () => APP.components.Login('student'),
                    'login/admin': () => APP.components.Login('admin'),
                    'dashboard': () => APP.components.Dashboard(),
                    'admin': () => APP.components.Admin(),
                    'admin/course': (id) => APP.components.CourseEditor(id),
                    'course': (id) => APP.components.CourseView(id),
                },

                init() {
                    window.addEventListener('hashchange', APP.router.handle);
                    APP.router.handle();
                },

                handle() {
                    const hash = window.location.hash.slice(1) || 'selection';
                    let [route, param, extra] = hash.split('/');
                    
                    if (route === 'admin' && param === 'course') {
                        route = 'admin/course';
                        param = extra;
                    } else if (route === 'login') {
                        route = `login/${param}`;
                        param = null;
                    }

                    if (!APP.state.user && !['selection', 'login/student', 'login/admin'].includes(route)) {
                        APP.router.navigate('selection');
                        return;
                    }

                    const viewFn = APP.router.routes[route];
                    const appDiv = document.getElementById('app');
                    
                    if (viewFn) {
                        if (APP.state.activeVideoUrl) {
                            URL.revokeObjectURL(APP.state.activeVideoUrl);
                            APP.state.activeVideoUrl = null;
                        }
                        appDiv.innerHTML = viewFn(param);
                        APP.router.afterRender(route, param);
                    } else {
                        APP.router.navigate('selection');
                    }
                },

                navigate(path) {
                    window.location.hash = path;
                },

                afterRender(route, param) {
                    const viewKey = route.replace('/', '_');
                    if (APP.events[viewKey]) APP.events[viewKey](param);
                    
                    const logoutBtns = document.querySelectorAll('.btn-logout');
                    logoutBtns.forEach(btn => {
                        btn.onclick = () => {
                            APP.state.user = null;
                            APP.router.navigate('selection');
                        };
                    });
                }
            },

            components: {
                Navbar(active) {
                    return `
                        <aside class="hidden md:flex w-64 flex-col bg-slate-900/80 backdrop-blur-xl border-r border-white/5 shrink-0 z-50">
                            <div class="h-20 flex items-center px-8 border-b border-white/5 cursor-pointer" onclick="APP.router.navigate('selection')">
                                <i class="fas fa-graduation-cap text-brand-400 text-2xl mr-3"></i>
                                <span class="text-xl font-bold tracking-tight">LearnHub</span>
                            </div>

                            <div class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
                                <button onclick="APP.router.navigate('dashboard')" class="w-full flex items-center px-4 py-3.5 rounded-xl smooth-transition ${active === 'dashboard' ? 'bg-brand-600/90 text-white shadow-lg shadow-brand-500/20 ring-1 ring-white/10' : 'text-slate-400 hover:bg-white/5 hover:text-white'}">
                                    <i class="fas fa-home w-5 mr-3"></i>
                                    <span class="font-medium">Home</span>
                                </button>
                                <button onclick="APP.router.navigate('dashboard')" class="w-full flex items-center px-4 py-3.5 rounded-xl smooth-transition text-slate-400 hover:bg-white/5 hover:text-white">
                                    <i class="fas fa-book-open w-5 mr-3"></i>
                                    <span class="font-medium">My Courses</span>
                                </button>
                                <button onclick="APP.router.navigate('dashboard')" class="w-full flex items-center px-4 py-3.5 rounded-xl smooth-transition text-slate-400 hover:bg-white/5 hover:text-white">
                                    <i class="fas fa-play-circle w-5 mr-3"></i>
                                    <span class="font-medium">Continue Watching</span>
                                </button>
                                <button onclick="APP.router.navigate('dashboard')" class="w-full flex items-center px-4 py-3.5 rounded-xl smooth-transition text-slate-400 hover:bg-white/5 hover:text-white">
                                    <i class="fas fa-user w-5 mr-3"></i>
                                    <span class="font-medium">Profile</span>
                                </button>
                            </div>

                            <div class="p-4 border-t border-white/5">
                                <div class="flex items-center p-3 rounded-xl bg-slate-800/50 border border-white/5 hover:bg-slate-800/80 smooth-transition cursor-pointer group">
                                    <div class="w-10 h-10 rounded-lg bg-brand-500 text-white flex items-center justify-center font-bold mr-3 shadow-lg shadow-brand-500/20">
                                        ${APP.state.user?.name?.charAt(0) || 'S'}
                                    </div>
                                    <div class="flex-1 overflow-hidden">
                                        <div class="text-sm font-bold truncate text-white group-hover:text-brand-300">${APP.state.user?.name || 'Student'}</div>
                                        <div class="text-xs text-slate-500">User</div>
                                    </div>
                                    <button class="btn-logout text-slate-400 hover:text-red-400 smooth-transition p-2"><i class="fas fa-sign-out-alt"></i></button>
                                </div>
                            </div>
                        </aside>
                    `;
                },
                
                // ... [Selection, Login, Admin components remain unchanged] ...
                Selection() {
                    return `
                        <div class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
                            <div class="z-10 text-center mb-16 relative">
                                <div class="flex items-center justify-center space-x-3 mb-6">
                                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-admin-500 to-brand-500 flex items-center justify-center shadow-2xl shadow-brand-500/30">
                                        <i class="fas fa-graduation-cap text-white text-3xl"></i>
                                    </div>
                                    <h1 class="text-5xl font-bold text-white tracking-tight">LearnHub</h1>
                                </div>
                                <h2 class="text-6xl font-bold mb-6 tracking-tight">Learn. Grow. <span class="text-transparent bg-clip-text bg-gradient-to-r from-admin-400 to-brand-400">Succeed.</span></h2>
                                <p class="text-slate-400 text-xl max-w-2xl mx-auto leading-relaxed">A powerful learning management system designed for modern education. Choose your portal to get started.</p>
                            </div>

                            <div class="z-10 flex flex-col md:flex-row gap-8 w-full max-w-5xl px-8">
                                <div class="flex-1 bg-gradient-to-br from-admin-600/20 to-admin-900/20 rounded-[32px] p-1 relative overflow-hidden group hover:scale-[1.01] smooth-transition shadow-2xl shadow-admin-900/30 border border-admin-500/20">
                                    <div class="absolute inset-0 bg-admin-600/10 blur-xl group-hover:bg-admin-600/20 smooth-transition"></div>
                                    <div class="glass-panel h-full w-full rounded-[28px] p-10 flex flex-col justify-between relative">
                                        <div>
                                            <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-8 group-hover:bg-admin-500/20 group-hover:border-admin-500/30 smooth-transition">
                                                <i class="fas fa-shield-alt text-3xl text-admin-300"></i>
                                            </div>
                                            <h3 class="text-3xl font-bold text-white mb-3">Admin Portal</h3>
                                            <p class="text-slate-400 text-lg leading-relaxed">Manage courses, content, users and analytics with powerful tools.</p>
                                        </div>
                                        <button onclick="APP.router.navigate('login/admin')" class="mt-10 flex items-center text-white font-semibold group-hover:translate-x-2 smooth-transition text-lg">
                                            Continue <i class="fas fa-arrow-right ml-3 text-sm"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="flex-1 bg-gradient-to-br from-brand-500/20 to-teal-900/20 rounded-[32px] p-1 relative overflow-hidden group hover:scale-[1.01] smooth-transition shadow-2xl shadow-brand-900/30 border border-brand-500/20">
                                     <div class="absolute inset-0 bg-brand-600/10 blur-xl group-hover:bg-brand-600/20 smooth-transition"></div>
                                    <div class="glass-panel h-full w-full rounded-[28px] p-10 flex flex-col justify-between relative">
                                        <div>
                                            <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-8 group-hover:bg-brand-500/20 group-hover:border-brand-500/30 smooth-transition">
                                                <i class="fas fa-user text-3xl text-brand-300"></i>
                                            </div>
                                            <h3 class="text-3xl font-bold text-white mb-3">Student Portal</h3>
                                            <p class="text-slate-400 text-lg leading-relaxed">Access your courses, track progress and learn at your own pace.</p>
                                        </div>
                                        <button onclick="APP.router.navigate('login/student')" class="mt-10 flex items-center text-white font-semibold group-hover:translate-x-2 smooth-transition text-lg">
                                            Continue <i class="fas fa-arrow-right ml-3 text-sm"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                },

                Login(type) {
                    const isAdmin = type === 'admin';
                    const colorClass = isAdmin ? 'from-admin-600 to-admin-800' : 'from-brand-500 to-teal-600';
                    return `
                        <div class="min-h-screen w-full flex items-center justify-center relative overflow-hidden">
                             <div class="absolute top-0 left-0 p-8 w-full z-20">
                                <div class="flex items-center space-x-3 text-2xl font-bold text-white">
                                    <div class="w-10 h-10 rounded-lg bg-gradient-to-tr ${colorClass} flex items-center justify-center shadow-lg">
                                        <i class="fas fa-graduation-cap text-white text-sm"></i>
                                    </div>
                                    <span class="tracking-tight">LearnHub</span>
                                </div>
                            </div>
                            <div class="glass-panel p-1 rounded-3xl w-full max-w-lg z-10 mx-6 relative shadow-2xl">
                                <div class="bg-slate-900/50 rounded-[22px] p-12 border border-white/5">
                                    <button onclick="APP.router.navigate('selection')" class="text-sm text-slate-400 hover:text-white mb-10 flex items-center smooth-transition">
                                        <i class="fas fa-arrow-left mr-2"></i> Back to selection
                                    </button>
                                    <h1 class="text-4xl font-bold text-white capitalize mb-2">${type} Login</h1>
                                    <p class="text-slate-400 mb-10">Enter your credentials to access the workspace.</p>
                                    <form id="login-form" class="space-y-6">
                                        <div class="space-y-2">
                                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Username</label>
                                            <input type="text" id="username" class="w-full bg-slate-950/50 border border-white/10 rounded-xl px-4 py-4 text-white focus:border-${isAdmin ? 'admin-500' : 'brand-500'} focus:ring-1 focus:ring-${isAdmin ? 'admin-500' : 'brand-500'} outline-none smooth-transition placeholder-slate-600" placeholder="${isAdmin ? 'admin' : 'student'}" value="${isAdmin ? 'admin' : 'student'}">
                                        </div>
                                        <div class="space-y-2">
                                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Password</label>
                                            <input type="password" id="password" class="w-full bg-slate-950/50 border border-white/10 rounded-xl px-4 py-4 text-white focus:border-${isAdmin ? 'admin-500' : 'brand-500'} focus:ring-1 focus:ring-${isAdmin ? 'admin-500' : 'brand-500'} outline-none smooth-transition placeholder-slate-600" placeholder="••••••••" value="${isAdmin ? 'admin' : 'student'}">
                                        </div>
                                        <button type="submit" class="w-full bg-gradient-to-r ${colorClass} text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl hover:scale-[1.01] smooth-transition mt-4">Sign In</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    `;
                },

                Admin() {
                    const tab = APP.state.adminTab;
                    const tabBtn = (id, label) => `
                        <button onclick="APP.state.adminTab = '${id}'; APP.router.handle();" 
                            class="px-6 py-2.5 rounded-lg text-sm font-semibold smooth-transition ${tab === id ? 'bg-admin-600 text-white shadow-lg shadow-admin-600/20' : 'text-slate-400 hover:text-white hover:bg-white/5'}">
                            ${label}
                        </button>
                    `;
                    let content = '';
                    if (tab === 'courses') content = APP.components.AdminCourses();
                    else if (tab === 'users') content = APP.components.AdminUsers();

                    return `

                                                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Weekly Activity</span>
                                                <span class="text-xs font-bold text-brand-400 bg-brand-500/10 px-2 py-1 rounded">Current Week</span>
                                            </div>
                                            <div class="flex-1 flex items-end justify-between space-x-3">
                                                ${[30, 45, 25, 60, 80, 55, 40].map((h, i) => `
                                                    <div class="w-full flex flex-col items-center group cursor-pointer">
                                                        <div class="w-full bg-slate-800 rounded-t-lg relative group-hover:bg-brand-500 smooth-transition overflow-hidden" style="height: ${h}%">
                                                            <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-black/20 to-transparent"></div>
                                                        </div>
                                                        <span class="text-[10px] text-slate-600 mt-2 font-bold uppercase group-hover:text-slate-400 smooth-transition">${['M','T','W','T','F','S','S'][i]}</span>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </header>

                                    <h2 class="text-3xl font-bold text-white mb-8 pl-2 border-l-4 border-brand-500">Continue Learning</h2>
                                    
                                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-8">
                                        ${APP.data.courses.length === 0 ? `
                                            <div class="col-span-full p-12 bg-white/5 rounded-3xl border border-white/5 text-center">
                                                <p class="text-slate-400 text-lg">No courses enrolled yet. Explore the library!</p>
                                            </div>
                                        ` : 
                                            APP.data.courses.map(c => `
                                            <div class="glass-panel rounded-[24px] overflow-hidden group hover:shadow-2xl hover:shadow-brand-900/20 hover:-translate-y-1 smooth-transition flex flex-col h-full border border-white/5 hover:border-brand-500/30">
                                                <div class="h-56 w-full bg-slate-900 relative overflow-hidden">
                                                    ${APP.ui.renderThumbnail(c.thumbnail, 'h-full w-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-110 smooth-transition duration-700')}
                                                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent opacity-90"></div>
                                                    ${c.batch ? `<div class="absolute top-4 right-4 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-bold border border-white/20 uppercase tracking-wider text-white shadow-xl">${c.batch}</div>` : ''}
                                                    <div class="absolute bottom-4 left-6 right-6">
                                                        <h3 class="text-2xl font-bold text-white leading-tight drop-shadow-lg mb-1">${c.title}</h3>
                                                    </div>
                                                </div>
                                                <div class="p-6 flex flex-col flex-1 bg-slate-900/20 backdrop-blur-sm">
                                                    <p class="text-sm text-slate-400 line-clamp-3 mb-6 flex-1 leading-relaxed">${c.description || 'No description provided.'}</p>
                                                    
                                                    <div class="flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">
                                                        <span>Progress</span>
                                                        <span class="text-brand-400">0%</span>
                                                    </div>
                                                    <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-6">
                                                        <div class="h-full bg-gradient-to-r from-brand-500 to-indigo-500 w-[5%] shadow-[0_0_10px_rgba(6,182,212,0.5)]"></div>
                                                    </div>
                                                    
                                                    <button onclick="APP.router.navigate('course/${c.id}')" class="w-full py-3.5 rounded-xl bg-white/5 hover:bg-brand-600 hover:text-white border border-white/10 hover:border-transparent font-bold text-slate-300 smooth-transition group-hover:shadow-lg">
                                                        Resume Course
                                                    </button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </main>
                        </div>
                    `;
                },

                CourseView(courseId) {
                    const course = APP.data.courses.find(c => c.id === courseId);
                    if (!course) return APP.router.navigate('dashboard');
                    
                    // Calculate Progress
                    const totalLessons = course.modules.reduce((acc, m) => acc + m.lessons.length, 0);
                    const completedLessons = course.modules.reduce((acc, m) => acc + m.lessons.filter(l => APP.data.progress[l.id]?.completed).length, 0);
                    const percent = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;
                    
                    return `
                        <div class="flex h-screen flex-col bg-dark-bg text-white overflow-hidden">
                            <!-- Top Bar -->
                            <header class="h-16 bg-slate-900/80 backdrop-blur-md border-b border-white/5 flex items-center justify-between px-6 shrink-0 z-20">
                                <div class="flex items-center space-x-6">
                                    <button onclick="APP.router.navigate('dashboard')" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center smooth-transition text-slate-400 hover:text-white">
                                        <i class="fas fa-times text-sm"></i>
                                    </button>
                                    <div class="h-8 w-px bg-white/10"></div>
                                    <div class="flex flex-col">
                                        <span class="text-[10px] text-brand-400 font-bold uppercase tracking-widest mb-0.5">Now Playing</span>
                                        <span class="font-bold text-sm truncate max-w-md text-slate-200">${course.title}</span>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-6">
                                     <!-- Progress Widget -->
                                     <div class="flex flex-col text-right">
                                        <div class="flex justify-between text-[10px] font-bold uppercase tracking-wider mb-1">
                                            <span class="text-slate-500 mr-2">Progress</span>
                                            <span class="text-brand-400">${percent}%</span>
                                        </div>
                                        <div class="w-32 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div class="h-full bg-gradient-to-r from-brand-500 to-indigo-500 transition-all duration-500" style="width: ${percent}%"></div>
                                        </div>
                                     </div>
                                     <div class="h-8 w-px bg-white/10"></div>
                                     <div class="flex items-center space-x-3">
                                         <button class="text-xs font-bold text-slate-400 hover:text-white uppercase tracking-wider bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg smooth-transition flex items-center border border-white/5">
                                            <i class="fas fa-chevron-left mr-2"></i> Prev
                                         </button>
                                         <button class="text-xs font-bold text-slate-400 hover:text-white uppercase tracking-wider bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg smooth-transition flex items-center border border-white/5">
                                            Next <i class="fas fa-chevron-right ml-2"></i>
                                         </button>
                                     </div>
                                </div>
                            </header>

                            <div class="flex flex-1 overflow-hidden" id="course-container">
                                <!-- Sidebar (Left) -->
                                <aside id="course-sidebar" class="w-96 bg-slate-950/50 backdrop-blur-xl border-r border-white/5 flex flex-col shrink-0 relative" style="width: 24rem; min-width: 16rem; max-width: 40vw;">
                                    <div class="p-6 border-b border-white/5 flex flex-col bg-slate-900/20">
                                        <div class="flex justify-between items-center mb-3">
                                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest"><i class="fas fa-list-ul mr-2 text-brand-500"></i> Course Content</span>
                                            <span class="bg-brand-500/10 text-brand-400 border border-brand-500/20 text-[10px] font-bold px-2 py-0.5 rounded-full">${course.modules.length} Modules</span>
                                        </div>
                                    </div>
                                    <div class="flex-1 overflow-y-auto custom-scrollbar">
                                        ${course.modules.map((m, i) => `
                                            <div class="border-b border-white/5 last:border-0">
                                                <div class="px-6 py-4 bg-white/[0.02] hover:bg-white/[0.04] flex items-center justify-between cursor-pointer smooth-transition group">
                                                    <span class="text-sm font-bold text-slate-300 group-hover:text-white smooth-transition line-clamp-1 flex-1 pr-4">${i+1}. ${m.title}</span>
                                                    <i class="fas fa-chevron-down text-xs text-slate-600 group-hover:text-slate-400"></i>
                                                </div>
                                                <div class="bg-black/20">
                                                    ${m.lessons.map(l => {
                                                        const isCompleted = APP.data.progress[l.id]?.completed;
                                                        return `
                                                        <div onclick="APP.events.playLesson('${l.id}')" class="flex items-center px-6 py-3.5 hover:bg-white/5 cursor-pointer group lesson-item smooth-transition border-l-2 border-transparent" data-id="${l.id}">
                                                            <div class="mr-4 relative flex items-center justify-center">
                                                                <i class="far fa-${isCompleted ? 'check-circle text-emerald-500' : 'circle text-slate-600 group-hover:text-slate-500'} text-sm smooth-transition"></i>
                                                            </div>
                                                            <div class="flex-1 min-w-0">
                                                                <div class="text-xs font-medium text-slate-400 group-hover:text-white truncate smooth-transition mb-1">${l.title}</div>
                                                                <div class="text-[10px] text-slate-600 flex items-center">
                                                                    <i class="fas ${l.type === 'video' ? 'fa-play-circle text-blue-400' : 'fa-file-alt text-orange-400'} mr-1.5 opacity-70"></i> ${l.duration}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    `}).join('')}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </aside>
                                
                                <!-- Drag Handle -->
                                <div id="sidebar-resizer" class="w-1 hover:w-1.5 bg-black hover:bg-brand-500 cursor-col-resize z-30 transition-all duration-200 opacity-50 hover:opacity-100 h-full shrink-0"></div>

                                <!-- Main Content (Center) -->
                                <main class="flex-1 bg-black/80 relative flex items-center justify-center overflow-hidden w-0 min-w-0">
                                     <!-- Background Glow -->
                                     <div class="absolute inset-0 pointer-events-none">
                                         <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[50vw] h-[50vw] bg-brand-900/5 rounded-full blur-[100px]"></div>
                                     </div>

                                    <div id="video-container" class="w-full h-full flex items-center justify-center hidden relative z-10 p-4">
                                        <!-- Responsive Video Wrapper -->
                                        <div class="w-full h-full flex items-center justify-center">
                                            <video id="course-video" class="max-w-full max-h-full aspect-video bg-black rounded-xl shadow-2xl shadow-black ring-1 ring-white/10" controlsList="nodownload"></video>
                                        </div>
                                    </div>
                                    
                                    <div id="pdf-container" class="w-full h-full hidden relative z-10 p-4">
                                        <iframe id="pdf-viewer" class="w-full h-full border-none rounded-xl shadow-2xl bg-white"></iframe>
                                    </div>
                                    
                                    <div id="empty-state" class="text-center p-8 relative z-10">
                                        <div class="w-24 h-24 rounded-full bg-white/5 flex items-center justify-center mx-auto mb-6 animate-pulse border border-white/10">
                                            <i class="fas fa-play text-4xl text-slate-500 ml-2"></i>
                                        </div>
                                        <h2 class="text-2xl font-bold text-white mb-2">Ready to learn?</h2>
                                        <p class="text-slate-400">Select a lesson from the sidebar to begin.</p>
                                    </div>
                                    
                                    <div id="loader" class="absolute inset-0 bg-black/90 z-50 flex items-center justify-center hidden backdrop-blur-sm">
                                        <div class="flex flex-col items-center">
                                            <div class="w-16 h-16 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                                            <div class="text-brand-500 font-bold text-sm tracking-widest uppercase">Loading Content</div>
                                        </div>
                                    </div>
                                </main>
                            </div>
                        </div>
                    `;
                }
            },

            events: {
                login_student: () => APP.events.attachLogin('student'),
                login_admin: () => APP.events.attachLogin('admin'),
                
                attachLogin(role) {
                    const form = document.getElementById('login-form');
                    if (form) form.onsubmit = (e) => {
                        e.preventDefault();
                        const u = document.getElementById('username').value;
                        const p = document.getElementById('password').value;
                        APP.services.login(u, p, role);
                    };
                },

                createDraftCourse() {
                    const newId = 'c_' + Date.now();
                    const newCourse = {
                        id: newId,
                        title: 'New Course',
                        description: 'Description here...',
                        batch: '',
                        thumbnail: 'fa-cube',
                        modules: []
                    };
                    APP.data.courses.push(newCourse);
                    APP.db.saveData().then(() => {
                        APP.router.navigate(`admin/course/${newId}`);
                    });
                },

                deleteUser(email) {
                    if(confirm('Delete user?')) {
                        APP.data.users = APP.data.users.filter(u => u.email !== email);
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },

                deleteCourse(id) {
                    if(confirm('Delete course?')) {
                        APP.data.courses = APP.data.courses.filter(c => c.id !== id);
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },

                deleteModule(courseId, modIndex) {
                    if(confirm('Delete module?')) {
                        const course = APP.data.courses.find(c => c.id === courseId);
                        if(course) {
                            course.modules.splice(modIndex, 1);
                            APP.db.saveData().then(() => APP.router.handle());
                        }
                    }
                },

                addModule(courseId) {
                    const course = APP.data.courses.find(c => c.id === courseId);
                    if(course) {
                        const name = prompt('Module Name:');
                        if (name) {
                            course.modules.push({
                                id: 'm_' + Date.now(),
                                title: name,
                                lessons: []
                            });
                            APP.db.saveData().then(() => APP.router.handle());
                        }
                    } else {
                        APP.notify('Course not found.', 'error');
                    }
                },

                addLesson(courseId, moduleIndex) {
                    const course = APP.data.courses.find(c => c.id === courseId);
                    if(course && course.modules[moduleIndex]) {
                        const title = prompt('Lesson Title:');
                        if(title) {
                            const newLesson = {
                                id: 'l_' + Date.now(),
                                title: title,
                                type: 'video', // default
                                duration: 'View'
                            };
                            course.modules[moduleIndex].lessons.push(newLesson);
                            APP.db.saveData().then(() => APP.router.handle());
                        }
                    }
                },

                deleteLesson(courseId, moduleIndex, lessonIndex) {
                    if(confirm('Delete this lesson?')) {
                         const course = APP.data.courses.find(c => c.id === courseId);
                         if(course && course.modules[moduleIndex]) {
                             course.modules[moduleIndex].lessons.splice(lessonIndex, 1);
                             APP.db.saveData().then(() => APP.router.handle());
                         }
                    }
                },

                moveModule(courseId, index, direction) {
                    const course = APP.data.courses.find(c => c.id === courseId);
                    if (!course) return;

                    const newIndex = index + direction;
                    if (newIndex >= 0 && newIndex < course.modules.length) {
                        // Swap
                        [course.modules[index], course.modules[newIndex]] = [course.modules[newIndex], course.modules[index]];
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },

                moveLesson(courseId, modIndex, lessonIndex, direction) {
                    const course = APP.data.courses.find(c => c.id === courseId);
                    if (!course || !course.modules[modIndex]) return;
                    
                    const lessons = course.modules[modIndex].lessons;
                    const newIndex = lessonIndex + direction;

                    if (newIndex >= 0 && newIndex < lessons.length) {
                        [lessons[lessonIndex], lessons[newIndex]] = [lessons[newIndex], lessons[lessonIndex]];
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },

                clearAllData() {
                    if(confirm('ARE YOU SURE? This will wipe everything.')) {
                        APP.db.clearAll().then(() => location.reload());
                    }
                },

                saveCourse(id) {
                    const title = document.getElementById('edit-title').value;
                    const batch = document.getElementById('edit-batch').value;
                    const thumb = document.getElementById('edit-thumb').value;
                    const desc = document.getElementById('edit-desc').value;

                    const course = APP.data.courses.find(c => c.id === id);
                    if(course) {
                        course.title = title;
                        course.batch = batch;
                        course.thumbnail = thumb;
                        course.description = desc;
                        APP.db.saveData().then(() => APP.notify('Changes Saved', 'success'));
                    }
                },

                course: (id) => {
                    // --- Sidebar Resizer Logic ---
                    const sidebar = document.getElementById('course-sidebar');
                    const resizer = document.getElementById('sidebar-resizer');
                    
                    if(sidebar && resizer) {
                        let isResizing = false;
                        
                        const startResize = (e) => {
                            isResizing = true;
                            document.body.style.cursor = 'col-resize';
                            resizer.classList.add('bg-brand-500', 'opacity-100');
                            e.preventDefault();
                        };
                        
                        const doResize = (e) => {
                            if(!isResizing) return;
                            const newWidth = e.clientX;
                            // Min/Max constraints are also handled via CSS max-width/min-width, but safe to clamp here too
                            if(newWidth > 200 && newWidth < window.innerWidth * 0.6) {
                                sidebar.style.width = newWidth + 'px';
                            }
                        };
                        
                        const stopResize = () => {
                            if(isResizing) {
                                isResizing = false;
                                document.body.style.cursor = '';
                                resizer.classList.remove('bg-brand-500', 'opacity-100');
                            }
                        };

                        resizer.addEventListener('mousedown', startResize);
                        document.addEventListener('mousemove', doResize);
                        document.addEventListener('mouseup', stopResize);
                    }
                    
                    // --- Video Player Logic ---
                    const video = document.getElementById('course-video');
                    if(video) {
                        video.onended = () => {
                            // Auto next logic placeholder
                        };
                        video.ontimeupdate = () => {
                            if(APP.state.activeLessonId && video.currentTime / video.duration > 0.9) {
                                if(!APP.data.progress[APP.state.activeLessonId]?.completed) {
                                    APP.data.progress[APP.state.activeLessonId] = { completed: true };
                                    APP.db.saveData();
                                    const icon = document.querySelector(`.lesson-item[data-id="${APP.state.activeLessonId}"] i.far`);
                                    if(icon) {
                                        icon.className = 'far fa-check-circle text-emerald-500 text-sm';
                                        icon.classList.remove('fa-circle');
                                        icon.classList.add('fa-check-circle');
                                    }
                                }
                            }
                        };
                    }
                },

                async playLesson(lessonId) {
                    APP.state.activeLessonId = lessonId;
                    const loader = document.getElementById('loader');
                    const videoContainer = document.getElementById('video-container');
                    const pdfContainer = document.getElementById('pdf-container');
                    const empty = document.getElementById('empty-state');
                    const video = document.getElementById('course-video');
                    const pdf = document.getElementById('pdf-viewer');

                    loader.classList.remove('hidden');
                    empty.classList.add('hidden');
                    videoContainer.classList.add('hidden');
                    pdfContainer.classList.add('hidden');
                    video.pause();

                    document.querySelectorAll('.lesson-item').forEach(el => {
                        el.classList.remove('bg-white/10', 'border-brand-500');
                        el.classList.add('border-transparent');
                    });
                    const activeEl = document.querySelector(`.lesson-item[data-id="${lessonId}"]`);
                    if(activeEl) {
                        activeEl.classList.add('bg-white/10', 'border-brand-500');
                        activeEl.classList.remove('border-transparent');
                    }

                    try {
                        const file = await APP.db.getFile(lessonId);
                        
                        let type = 'video';
                        APP.data.courses.forEach(c => c.modules.forEach(m => m.lessons.forEach(l => { if(l.id === lessonId) type = l.type })));

                        if(file) {
                            const url = URL.createObjectURL(file);
                            if(APP.state.activeVideoUrl) URL.revokeObjectURL(APP.state.activeVideoUrl);
                            APP.state.activeVideoUrl = url;

                            if(type === 'video') {
                                videoContainer.classList.remove('hidden');
                                video.src = url;
                                video.controls = true;
                                try { await video.play(); } catch(e){}
                            } else if (type === 'pdf') {
                                pdfContainer.classList.remove('hidden');
                                pdf.src = url;
                            } else {
                                APP.notify('Preview not available for this file type.', 'info');
                                empty.classList.remove('hidden');
                                empty.innerHTML = `
                                    <div class="mb-6 text-brand-400"><i class="fas fa-file-download text-6xl"></i></div>
                                    <div class="text-white text-xl font-bold mb-2">File Ready</div>
                                    <div class="text-slate-400">This file type cannot be previewed directly.</div>
                                `;
                            }
                        } else {
                             if(type === 'video') {
                                videoContainer.classList.remove('hidden');
                                video.src = ''; 
                                APP.notify('Demo: File not found in DB', 'info');
                             }
                        }
                    } catch(e) {
                        console.error(e);
                        APP.notify('Error loading content', 'error');
                    } finally {
                        loader.classList.add('hidden');
                    }
                }
            },

            notify(msg, type = 'info') {
                const div = document.createElement('div');
                const colors = type === 'success' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-200' : 
                               type === 'error' ? 'bg-red-500/20 border-red-500 text-red-200' : 
                               'bg-blue-500/20 border-blue-500 text-blue-200';
                
                div.className = `fixed bottom-8 right-8 z-[100] px-6 py-4 rounded-xl border backdrop-blur-md shadow-2xl flex items-center space-x-4 transform transition-all duration-500 translate-y-20 opacity-0 ${colors}`;
                div.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'} text-xl"></i> <span class="font-medium">${msg}</span>`;
                document.body.appendChild(div);
                requestAnimationFrame(() => div.classList.remove('translate-y-20', 'opacity-0'));
                setTimeout(() => { div.classList.add('translate-y-20', 'opacity-0'); setTimeout(() => div.remove(), 500); }, 3000);
            },

            async init() {
                try {
                    await APP.db.init();
                    await APP.db.loadData();
                    APP.router.init();
                } catch (e) { document.body.innerHTML = '<div class="h-screen w-screen flex items-center justify-center text-white bg-black">Init Failed</div>'; }
            }
        };

        document.addEventListener('DOMContentLoaded', APP.init);
    </script>
</body>
</html>
