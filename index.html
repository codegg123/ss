<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub | Professional LMS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#22d3ee', // cyan-400
                            500: '#06b6d4', // cyan-500
                            600: '#0891b2',
                            glow: '#22d3ee',
                        },
                        admin: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        },
                        dark: {
                            bg: '#020617', // slate-950
                            surface: '#0f172a', // slate-900
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Base Styles */
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        
        /* Glassmorphism Ultra High Definition */
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-panel {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.7) 100%);
            backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        .video-fit {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
        
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        .lesson-active {
            background: rgba(255, 255, 255, 0.08);
            border-left: 3px solid #06b6d4 !important;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }

        /* Custom Range Slider for Seek Bar */
        .seek-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }
        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #06b6d4;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        .seek-bar::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #06b6d4;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden selection:bg-brand-500 selection:text-white relative">

    <!-- Global Background Ambience -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-10%] right-[-5%] w-[70vw] h-[70vw] bg-indigo-900/10 rounded-full blur-[180px]"></div>
        <div class="absolute bottom-[-10%] left-[-5%] w-[70vw] h-[70vw] bg-cyan-900/5 rounded-full blur-[180px]"></div>
    </div>

    <div id="app" class="h-full w-full flex flex-col relative z-10"></div>
    
    <!-- Modals Container -->
    <div id="modal-container" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/80 backdrop-blur-md p-4" onclick="APP.ui.closeModal()"></div>

    <script>
        /**
         * LearnHub LMS - Single File Architecture
         */
        const APP = {
            CONSTANTS: {
                DB_NAME: 'LearnHub_Enterprise_DB',
                DB_VERSION: 1, 
                STORE_FILES: 'files',
                STORE_DATA: 'data'
            },

            state: {
                user: null, 
                isLoading: true,
                adminTab: 'courses', 
                activeVideoUrl: null,
                activeLessonId: null,
                scannedModules: [],
                importTargetCourseId: null,
                currentModalData: {}
            },

            data: {
                courses: [], 
                users: [],
                progress: {}, 
                activity: [] 
            },

            utils: {
                generateId: (prefix = 'id') => prefix + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                formatTime(seconds) {
                    if (!seconds || isNaN(seconds)) return '0:00';
                    const h = Math.floor(seconds / 3600);
                    const m = Math.floor((seconds % 3600) / 60);
                    const s = Math.floor(seconds % 60);
                    if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    return `${m}:${s.toString().padStart(2, '0')}`;
                },
                parseYouTubeId(url) {
                    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
                    const match = url.match(regExp);
                    return (match && match[2].length === 11) ? match[2] : null;
                },
                convertDriveLink(url) {
                    if (url.includes('drive.google.com') && url.includes('/view')) {
                        return url.replace('/view', '/preview');
                    }
                    return url;
                },
                getTypeFromUrl(url) {
                    if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
                    if (url.includes('drive.google.com')) return 'drive';
                    if (url.match(/\.(jpeg|jpg|gif|png)$/) != null) return 'image';
                    if (url.match(/\.(pdf)$/) != null) return 'pdf';
                    return 'video'; 
                }
            },

            db: {
                instance: null,
                async init() {
                    return new Promise((resolve, reject) => {
                        const request = indexedDB.open(APP.CONSTANTS.DB_NAME, APP.CONSTANTS.DB_VERSION);
                        request.onerror = (e) => reject('DB Error');
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(APP.CONSTANTS.STORE_FILES)) db.createObjectStore(APP.CONSTANTS.STORE_FILES);
                            if (!db.objectStoreNames.contains(APP.CONSTANTS.STORE_DATA)) db.createObjectStore(APP.CONSTANTS.STORE_DATA);
                        };
                        request.onsuccess = (e) => {
                            APP.db.instance = e.target.result;
                            resolve(APP.db.instance);
                        };
                    });
                },
                async saveFile(id, blob) {
                    return APP.db.op(APP.CONSTANTS.STORE_FILES, 'readwrite', (store) => store.put(blob, id));
                },
                async getFile(id) {
                    return APP.db.op(APP.CONSTANTS.STORE_FILES, 'readonly', (store) => store.get(id));
                },
                async saveData() {
                    return APP.db.op(APP.CONSTANTS.STORE_DATA, 'readwrite', (store) => store.put(APP.data, 'main_data'));
                },
                async loadData() {
                    try {
                        const data = await APP.db.op(APP.CONSTANTS.STORE_DATA, 'readonly', (store) => store.get('main_data'));
                        if (data) APP.data = data;
                        else APP.services.seedData();
                        
                        if(!APP.data.users || APP.data.users.length === 0) {
                            APP.data.users = [
                                { name: 'Admin', email: 'admin', role: 'admin', password: 'admin' },
                                { name: 'Student', email: 'student', role: 'student', password: 'student' }
                            ];
                        }
                    } catch (e) { APP.services.seedData(); }
                },
                async clearAll() {
                     const tx = APP.db.instance.transaction([APP.CONSTANTS.STORE_FILES, APP.CONSTANTS.STORE_DATA], 'readwrite');
                     tx.objectStore(APP.CONSTANTS.STORE_FILES).clear();
                     tx.objectStore(APP.CONSTANTS.STORE_DATA).clear();
                     return new Promise(resolve => tx.oncomplete = resolve);
                },
                op(storeName, mode, callback) {
                    return new Promise((resolve, reject) => {
                        const tx = APP.db.instance.transaction(storeName, mode);
                        const store = tx.objectStore(storeName);
                        const request = callback(store);
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                }
            },

            router: {
                init() {
                    window.onhashchange = () => this.handle();
                    if (!window.location.hash) window.location.hash = '#selection';
                    this.handle();
                },
                navigate(path) {
                    window.location.hash = '#' + path;
                },
                handle() {
                    const hash = window.location.hash.slice(1) || 'selection';
                    const [path, p1, p2] = hash.split('/');
                    const appEl = document.getElementById('app');
                    
                    if (path === 'selection') appEl.innerHTML = APP.components.Selection();
                    else if (path === 'login') appEl.innerHTML = APP.components.Login(p1);
                    else if (path === 'admin') {
                        if (APP.state.user?.role !== 'admin') return this.navigate('login/admin');
                        if (p1 === 'course' && p2) appEl.innerHTML = APP.components.CourseEditor(p2);
                        else appEl.innerHTML = APP.components.Admin();
                    }
                    else if (path === 'dashboard') {
                        if (!APP.state.user) return this.navigate('selection');
                        appEl.innerHTML = APP.components.Dashboard();
                    }
                    else if (path === 'course' && p1) {
                        if (!APP.state.user) return this.navigate('selection');
                        appEl.innerHTML = APP.components.CourseView(p1);
                    }

                    this.afterRender(path, p1, p2);
                },
                afterRender(path, p1, p2) {
                    // Global Event: Logout
                    document.querySelectorAll('.btn-logout').forEach(b => {
                        b.onclick = () => { APP.state.user = null; APP.router.navigate('selection'); };
                    });

                    if (path === 'login') APP.events.attachLogin(p1);
                    if (path === 'course') APP.events.course(p1);
                    
                    // Admin User Form wiring
                    if (path === 'admin' && !p1) {
                        const form = document.getElementById('add-user-form');
                        if (form) form.onsubmit = (e) => {
                            e.preventDefault();
                            const name = document.getElementById('new-user-name').value;
                            const email = document.getElementById('new-user-email').value;
                            const pass = document.getElementById('new-user-pass').value;
                            const role = document.getElementById('new-user-role').value;
                            if (name && email && pass) {
                                APP.data.users.push({ name, email, password: pass, role });
                                APP.db.saveData().then(() => APP.router.handle());
                                APP.notify('User added!', 'success');
                            }
                        };
                    }
                }
            },

            services: {
                seedData() {
                    APP.data.courses = [
                        {
                            id: 'c1',
                            title: 'Mastering Modern UI/UX',
                            description: 'Learn the principles of glassmorphism, responsive layouts, and modern typography using standard tools.',
                            batch: 'Spring 2025',
                            thumbnail: 'https://images.unsplash.com/photo-1558655146-d09347e92766?q=80&w=2000&auto=format&fit=crop',
                            modules: [
                                {
                                    id: 'm1',
                                    title: 'Phase 1: Foundations',
                                    lessons: [
                                        { id: 'l1', title: 'Welcome to LearnHub', type: 'video', duration: '10:00', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' },
                                        { id: 'l2', title: 'Getting Started Guide', type: 'pdf', duration: '5 min read', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf' }
                                    ]
                                }
                            ]
                        }
                    ];
                    APP.data.users = [
                        { name: 'Administrator', email: 'admin', role: 'admin', password: 'admin' },
                        { name: 'Demo Student', email: 'student', role: 'student', password: 'student' }
                    ];
                    APP.data.progress = {};
                },

                login(username, password, role) {
                    const user = APP.data.users.find(u => (u.email === username) && u.password === password && u.role === role);
                    if (user) {
                        APP.state.user = user;
                        APP.router.navigate(role === 'admin' ? 'admin' : 'dashboard');
                        APP.notify(`Welcome back, ${user.name}!`, 'success');
                    } else {
                        APP.notify('Invalid credentials for ' + role, 'error');
                    }
                },

                async importFilesToCourse(courseId, fileList) {
                    const files = Array.from(fileList);
                    APP.state.importTargetCourseId = courseId;
                    if (files.length === 0) return;
                    APP.notify('Analyzing folder...', 'info');
                    const scanned = {}; 
                    for (const file of files) {
                        const pathParts = file.webkitRelativePath.split('/');
                        if (file.name.startsWith('.')) continue;
                        let moduleName = pathParts.length > 1 ? pathParts[pathParts.length - 2] : "Resources";
                        moduleName = moduleName.replace(/_/g, ' ').replace(/^\d+\.?\s*/, ''); 
                        if (!scanned[moduleName]) scanned[moduleName] = [];
                        const ext = file.name.split('.').pop().toLowerCase();
                        let type = 'file';
                        if (file.type.startsWith('video') || ['mp4', 'webm', 'ogg', 'mov', 'mkv'].includes(ext)) type = 'video';
                        else if (file.type === 'application/pdf' || ext === 'pdf') type = 'pdf';
                        scanned[moduleName].push({ title: file.name.replace(/\.[^/.]+$/, "").replace(/_/g, ' '), type: type, fileObj: file });
                    }
                    APP.state.scannedModules = Object.keys(scanned).map(name => ({ id: APP.utils.generateId('m'), title: name, lessons: scanned[name], selected: true }));
                    APP.ui.showModal(APP.components.ImportReviewModal());
                },

                async executeImport() {
                    const courseId = APP.state.importTargetCourseId;
                    const modulesToImport = APP.state.scannedModules.filter(m => m.selected);
                    const course = APP.data.courses.find(c => c.id === courseId);
                    if (!course) return;
                    APP.notify(`Importing ${modulesToImport.length} modules...`, 'info');
                    let promises = [];
                    for (const mod of modulesToImport) {
                        const newMod = { id: mod.id, title: mod.title, lessons: [] };
                        for (const les of mod.lessons) {
                            const lesId = APP.utils.generateId('l');
                            newMod.lessons.push({ id: lesId, title: les.title, type: les.type, duration: 'Local', url: null });
                            if (les.fileObj) promises.push(APP.db.saveFile(lesId, les.fileObj));
                        }
                        course.modules.push(newMod);
                    }
                    await Promise.all(promises);
                    await APP.db.saveData();
                    APP.ui.closeModal();
                    APP.notify('Import finished', 'success');
                    APP.router.handle();
                },

                exportData() {
                    const blob = new Blob([JSON.stringify(APP.data)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'learnhub_backup.json';
                    a.click();
                }
            },

            ui: {
                renderThumbnail(src, className = '') {
                    if (src && src.startsWith('http')) {
                        return `<img src="${src}" class="w-full h-full object-cover ${className}" alt="">`;
                    }
                    return `<div class="w-full h-full flex items-center justify-center bg-slate-800 ${className}"><i class="fas ${src || 'fa-cube'} text-slate-500"></i></div>`;
                },
                showModal(html) {
                    const el = document.getElementById('modal-container');
                    el.innerHTML = html;
                    el.classList.remove('hidden');
                },
                closeModal() {
                    const el = document.getElementById('modal-container');
                    el.classList.add('hidden');
                    el.innerHTML = '';
                }
            },

            components: {
                Selection() {
                    return `
                        <div class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden animate-fade">
                            <div class="z-10 text-center mb-16 px-6">
                                <div class="flex items-center justify-center space-x-4 mb-8">
                                    <div class="w-20 h-20 rounded-[24px] bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center shadow-2xl shadow-brand-500/40">
                                        <i class="fas fa-graduation-cap text-white text-4xl"></i>
                                    </div>
                                    <h1 class="text-6xl font-black text-white tracking-tighter">LearnHub</h1>
                                </div>
                                <h2 class="text-5xl font-extrabold mb-6 tracking-tight text-white">Elevate your <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-indigo-400">knowledge.</span></h2>
                                <p class="text-slate-400 text-xl max-w-2xl mx-auto leading-relaxed">The ultimate enterprise-grade learning management system. Seamless, beautiful, powerful.</p>
                            </div>
                            <div class="z-10 flex flex-col md:flex-row gap-8 w-full max-w-5xl px-8">
                                <div onclick="APP.router.navigate('login/admin')" class="flex-1 glass-panel rounded-[40px] p-10 group hover:scale-[1.02] smooth-transition cursor-pointer border border-white/5 hover:border-brand-500/30">
                                    <div class="w-16 h-16 rounded-2xl bg-brand-500/10 flex items-center justify-center mb-8 group-hover:bg-brand-500/20 smooth-transition">
                                        <i class="fas fa-shield-halved text-3xl text-brand-400"></i>
                                    </div>
                                    <h3 class="text-3xl font-bold text-white mb-4">Admin Portal</h3>
                                    <p class="text-slate-400 text-lg">Manage curriculums, analyze student progress, and organize resources.</p>
                                    <div class="mt-8 flex items-center text-brand-400 font-bold group-hover:translate-x-2 smooth-transition">Continue <i class="fas fa-arrow-right ml-3"></i></div>
                                </div>
                                <div onclick="APP.router.navigate('login/student')" class="flex-1 glass-panel rounded-[40px] p-10 group hover:scale-[1.02] smooth-transition cursor-pointer border border-white/5 hover:border-indigo-500/30">
                                    <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 flex items-center justify-center mb-8 group-hover:bg-indigo-500/20 smooth-transition">
                                        <i class="fas fa-user-graduate text-3xl text-indigo-400"></i>
                                    </div>
                                    <h3 class="text-3xl font-bold text-white mb-4">Student Hub</h3>
                                    <p class="text-slate-400 text-lg">Access your assigned courses, track your learning journey, and excel.</p>
                                    <div class="mt-8 flex items-center text-indigo-400 font-bold group-hover:translate-x-2 smooth-transition">Continue <i class="fas fa-arrow-right ml-3"></i></div>
                                </div>
                            </div>
                        </div>
                    `;
                },

                Login(type) {
                    const isAdmin = type === 'admin';
                    const brandColor = isAdmin ? 'from-brand-600 to-brand-400' : 'from-indigo-600 to-indigo-400';
                    return `
                        <div class="min-h-screen flex items-center justify-center p-6 animate-fade">
                            <div class="glass-panel w-full max-w-lg rounded-[32px] overflow-hidden relative">
                                <div class="p-12">
                                    <button onclick="APP.router.navigate('selection')" class="text-slate-500 hover:text-white mb-10 flex items-center smooth-transition font-medium">
                                        <i class="fas fa-chevron-left mr-3"></i> Back
                                    </button>
                                    <h2 class="text-4xl font-bold text-white mb-2 capitalize">${type} Login</h2>
                                    <p class="text-slate-400 mb-10">Access your workspace with your credentials.</p>
                                    <form id="login-form" class="space-y-6">
                                        <div class="space-y-2">
                                            <label class="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Identifier</label>
                                            <input type="text" id="username" value="${isAdmin ? 'admin' : 'student'}" class="w-full bg-slate-900/50 border border-white/10 rounded-2xl px-5 py-4 text-white focus:border-brand-500 outline-none smooth-transition" placeholder="Email or Username">
                                        </div>
                                        <div class="space-y-2">
                                            <label class="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Security Key</label>
                                            <input type="password" id="password" value="${isAdmin ? 'admin' : 'student'}" class="w-full bg-slate-900/50 border border-white/10 rounded-2xl px-5 py-4 text-white focus:border-brand-500 outline-none smooth-transition" placeholder="••••••••">
                                        </div>
                                        <button type="submit" class="w-full py-5 rounded-2xl bg-gradient-to-r ${brandColor} text-white font-bold shadow-2xl hover:scale-[1.01] smooth-transition text-lg">Sign In</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    `;
                },

                Admin() {
                    const tab = APP.state.adminTab;
                    const tabBtn = (id, label) => `<button onclick="APP.state.adminTab='${id}'; APP.router.handle()" class="px-6 py-2.5 rounded-xl text-sm font-bold smooth-transition ${tab === id ? 'bg-white/10 text-white border border-white/10' : 'text-slate-500 hover:text-slate-300'}">${label}</button>`;
                    
                    return `
                        <div class="flex flex-col h-full w-full animate-fade">
                            <header class="h-24 px-8 border-b border-white/5 flex items-center justify-between bg-slate-900/40 backdrop-blur-xl">
                                <div class="flex items-center space-x-6">
                                    <div class="w-12 h-12 rounded-xl bg-brand-500 flex items-center justify-center text-white text-xl shadow-lg">
                                        <i class="fas fa-toolbox"></i>
                                    </div>
                                    <div>
                                        <h1 class="text-2xl font-black text-white tracking-tight">Admin Console</h1>
                                        <p class="text-xs text-brand-400 font-bold uppercase tracking-widest">Enterprise Controller</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    ${tabBtn('courses', 'Courses')}
                                    ${tabBtn('users', 'Users')}
                                    ${tabBtn('settings', 'System')}
                                </div>
                                <button class="btn-logout w-10 h-10 rounded-full border border-white/10 flex items-center justify-center text-slate-400 hover:text-red-400 smooth-transition hover:bg-red-500/10"><i class="fas fa-power-off"></i></button>
                            </header>
                            <main class="flex-1 overflow-y-auto p-10 bg-slate-950/20">
                                <div class="max-w-7xl mx-auto">
                                    ${tab === 'courses' ? APP.components.AdminCourses() : tab === 'users' ? APP.components.AdminUsers() : APP.components.AdminSettings()}
                                </div>
                            </main>
                        </div>
                    `;
                },

                AdminCourses() {
                    return `
                        <div class="flex justify-between items-center mb-10">
                            <div>
                                <h2 class="text-3xl font-bold text-white mb-2">Manage Programs</h2>
                                <p class="text-slate-400">Create and curate your organization's learning path.</p>
                            </div>
                            <button onclick="APP.events.createDraftCourse()" class="bg-brand-600 hover:bg-brand-500 text-white px-8 py-4 rounded-2xl font-bold shadow-xl smooth-transition flex items-center">
                                <i class="fas fa-plus mr-3"></i> New Program
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${APP.data.courses.map(c => `
                                <div class="glass-panel p-8 rounded-3xl group border border-white/5 hover:border-brand-500/30 smooth-transition">
                                    <div class="flex items-start space-x-5 mb-8">
                                        <div class="w-24 h-24 rounded-2xl bg-slate-800 overflow-hidden shrink-0 shadow-2xl">
                                            ${APP.ui.renderThumbnail(c.thumbnail)}
                                        </div>
                                        <div class="min-w-0">
                                            <h3 class="font-bold text-xl text-white truncate mb-1">${c.title}</h3>

                                        <p class="text-slate-500 text-lg max-w-md">Select any module from the curriculum on the left to begin your learning session.</p>
                                    </div>
                                    <div id="loader" class="absolute inset-0 bg-black/95 z-[60] flex flex-col items-center justify-center hidden">
                                        <div class="w-12 h-12 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                                        <div class="text-brand-400 font-bold uppercase tracking-[0.3em] text-[10px]">Loading Asset</div>
                                    </div>
                                </main>
                            </div>
                        </div>
                    `;
                },

                ImportReviewModal() {
                    return `
                        <div class="glass-panel w-full max-w-3xl rounded-[40px] p-12 animate-fade flex flex-col max-h-[90vh]" onclick="event.stopPropagation()">
                            <h2 class="text-3xl font-bold text-white mb-2">Import Review</h2>
                            <p class="text-slate-400 mb-8">We found ${APP.state.scannedModules.length} modules. Choose what to import.</p>
                            <div class="flex-1 overflow-y-auto space-y-4 pr-4">
                                ${APP.state.scannedModules.map((m, idx) => `
                                    <div class="p-6 rounded-3xl bg-white/5 border border-white/5 flex items-center justify-between">
                                        <div class="flex items-center space-x-5">
                                            <input type="checkbox" checked onchange="APP.state.scannedModules[${idx}].selected = this.checked" class="w-6 h-6 rounded-lg bg-slate-900 border-white/10 text-brand-500">
                                            <div>
                                                <div class="font-bold text-white text-lg">${m.title}</div>
                                                <div class="text-xs text-slate-500 uppercase font-black tracking-widest">${m.lessons.length} assets</div>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="mt-10 flex justify-end space-x-4 border-t border-white/5 pt-10">
                                <button onclick="APP.ui.closeModal()" class="px-8 py-4 rounded-2xl text-slate-400 font-bold">Discard</button>
                                <button onclick="APP.services.executeImport()" class="px-10 py-4 rounded-2xl bg-brand-600 text-white font-bold shadow-xl">Confirm Import</button>
                            </div>
                        </div>
                    `;
                },

                AddLessonModal(courseId, modIdx) {
                    return `
                        <div class="glass-panel w-full max-w-lg rounded-[40px] p-12 animate-fade" onclick="event.stopPropagation()">
                            <h2 class="text-2xl font-bold text-white mb-10">Append Content</h2>
                            <form id="lesson-form" class="space-y-8" onsubmit="event.preventDefault(); APP.events.submitAddLesson('${courseId}', ${modIdx})">
                                <div class="space-y-2">
                                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Name</label>
                                    <input type="text" id="les-title" required class="w-full bg-slate-900 border border-white/10 rounded-2xl px-5 py-4 text-white">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Method</label>
                                    <select id="les-method" onchange="APP.events.toggleLessonInput(this.value)" class="w-full bg-slate-900 border border-white/10 rounded-2xl px-5 py-4 text-white">
                                        <option value="upload">Local Upload</option>
                                        <option value="youtube">YouTube Embed</option>
                                        <option value="link">Public URL</option>
                                    </select>
                                </div>
                                <div id="les-input-container">
                                    <input type="file" id="les-file" class="w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-xs file:font-black file:uppercase file:bg-brand-500/10 file:text-brand-400">
                                </div>
                                <div class="flex justify-end space-x-4 pt-4">
                                    <button type="button" onclick="APP.ui.closeModal()" class="px-6 py-3 rounded-xl text-slate-400 font-bold">Cancel</button>
                                    <button type="submit" class="px-8 py-3 rounded-xl bg-brand-600 text-white font-bold shadow-xl shadow-brand-500/20">Add Asset</button>
                                </div>
                            </form>
                        </div>
                    `;
                }
            },

            events: {
                attachLogin(role) {
                    const f = document.getElementById('login-form');
                    if (f) f.onsubmit = (e) => {
                        e.preventDefault();
                        APP.services.login(document.getElementById('username').value, document.getElementById('password').value, role);
                    };
                },
                createDraftCourse() {
                    const id = APP.utils.generateId('c');
                    APP.data.courses.push({ id, title: 'Unpublished Program', thumbnail: 'fa-cube', modules: [], batch: '', description: '' });
                    APP.db.saveData().then(() => APP.router.navigate(`admin/course/${id}`));
                },
                deleteCourse(id) {
                    if (confirm('Delete this entire program?')) {
                        APP.data.courses = APP.data.courses.filter(c => c.id !== id);
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },
                saveCourse(id) {
                    const c = APP.data.courses.find(x => x.id === id);
                    if (c) {
                        c.title = document.getElementById('edit-title').value;
                        c.batch = document.getElementById('edit-batch').value;
                        c.thumbnail = document.getElementById('edit-thumb').value;
                        c.description = document.getElementById('edit-desc').value;
                        APP.db.saveData().then(() => APP.notify('Program updated!', 'success'));
                    }
                },
                renameCourse(id) {
                    const c = APP.data.courses.find(x => x.id === id);
                    if (!c) return;
                    const n = prompt('Rename Program:', c.title);
                    if (n && n !== c.title) {
                        c.title = n;
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },
                renameModule(cid, midx) {
                    const c = APP.data.courses.find(x => x.id === cid);
                    const m = c.modules[midx];
                    const n = prompt('Rename Module:', m.title);
                    if (n && n !== m.title) {
                        m.title = n;
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },
                renameLesson(cid, midx, lidx) {
                    const c = APP.data.courses.find(x => x.id === cid);
                    const l = c.modules[midx].lessons[lidx];
                    const n = prompt('Rename Lesson:', l.title);
                    if (n && n !== l.title) {
                        l.title = n;
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },
                moveModule(cid, midx, dir) {
                    const c = APP.data.courses.find(x => x.id === cid);
                    if (!c) return;
                    const newIdx = dir === 'up' ? midx - 1 : midx + 1;
                    if (newIdx < 0 || newIdx >= c.modules.length) return;
                    const temp = c.modules[midx];
                    c.modules[midx] = c.modules[newIdx];
                    c.modules[newIdx] = temp;
                    APP.db.saveData().then(() => APP.router.handle());
                },
                moveLesson(cid, midx, lidx, dir) {
                    const c = APP.data.courses.find(x => x.id === cid);
                    const m = c.modules[midx];
                    if (!m) return;
                    const newIdx = dir === 'up' ? lidx - 1 : lidx + 1;
                    if (newIdx < 0 || newIdx >= m.lessons.length) return;
                    const temp = m.lessons[lidx];
                    m.lessons[lidx] = m.lessons[newIdx];
                    m.lessons[newIdx] = temp;
                    APP.db.saveData().then(() => APP.router.handle());
                },
                addModule(id) {
                    const n = prompt('Module Name:');
                    if (n) {
                        const c = APP.data.courses.find(x => x.id === id);
                        c.modules.push({ id: APP.utils.generateId('m'), title: n, lessons: [] });
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },
                deleteModule(cid, idx) {
                    if (confirm('Delete this module?')) {
                        const c = APP.data.courses.find(x => x.id === cid);
                        if (c) { c.modules.splice(idx, 1); APP.db.saveData().then(() => APP.router.handle()); }
                    }
                },
                deleteLesson(cid, midx, lidx) {
                    if (confirm('Delete this lesson?')) {
                        const c = APP.data.courses.find(x => x.id === cid);
                        if (c) { c.modules[midx].lessons.splice(lidx, 1); APP.db.saveData().then(() => APP.router.handle()); }
                    }
                },
                openAddLessonModal(cid, midx) {
                    APP.ui.showModal(APP.components.AddLessonModal(cid, midx));
                },
                toggleLessonInput(val) {
                    const container = document.getElementById('les-input-container');
                    if (val === 'upload') container.innerHTML = `<input type="file" id="les-file" class="w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-xs file:font-black file:uppercase file:bg-brand-500/10 file:text-brand-400">`;
                    else container.innerHTML = `<input type="url" id="les-url" required class="w-full bg-slate-900 border border-white/10 rounded-2xl px-5 py-4 text-white" placeholder="https://...">`;
                },
                async submitAddLesson(cid, midx) {
                    const title = document.getElementById('les-title').value;
                    const method = document.getElementById('les-method').value;
                    const c = APP.data.courses.find(x => x.id === cid);
                    const lid = APP.utils.generateId('l');
                    const les = { id: lid, title, duration: 'Asset', type: 'file', url: null };
                    
                    if (method === 'upload') {
                        const file = document.getElementById('les-file').files[0];
                        if (!file) return APP.notify('Select file', 'error');
                        const ext = file.name.split('.').pop().toLowerCase();
                        if (file.type.startsWith('video') || ['mp4', 'webm', 'ogg'].includes(ext)) les.type = 'video';
                        else if (file.type === 'application/pdf' || ext === 'pdf') les.type = 'pdf';
                        await APP.db.saveFile(lid, file);
                    } else {
                        const url = document.getElementById('les-url').value;
                        les.url = url;
                        les.type = APP.utils.getTypeFromUrl(url);
                    }
                    c.modules[midx].lessons.push(les);
                    await APP.db.saveData();
                    APP.ui.closeModal();
                    APP.router.handle();
                },
                async playLesson(lid) {
                    APP.state.activeLessonId = lid;
                    const loader = document.getElementById('loader');
                    const player = document.getElementById('player-container');
                    const empty = document.getElementById('empty-state');
                    const video = document.getElementById('course-video');
                    const embed = document.getElementById('embed-viewer');
                    const customControls = document.getElementById('custom-video-controls');
                    
                    loader.classList.remove('hidden');
                    empty.classList.add('hidden');
                    player.classList.remove('hidden');
                    video.classList.add('hidden');
                    embed.classList.add('hidden');
                    customControls.classList.add('hidden');
                    video.pause(); video.src = "";
                    
                    document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('lesson-active'));
                    const activeEl = document.querySelector(`.lesson-item[data-id="${lid}"]`);
                    if (activeEl) activeEl.classList.add('lesson-active');

                    let lesson = null;
                    APP.data.courses.forEach(c => c.modules.forEach(m => m.lessons.forEach(l => { if(l.id === lid) lesson = l; })));

                    try {
                        if (lesson.url) {
                            if (lesson.type === 'youtube') {
                                const yid = APP.utils.parseYouTubeId(lesson.url);
                                embed.src = `https://www.youtube.com/embed/${yid}?autoplay=1`;
                                embed.classList.remove('hidden');
                            } else if (lesson.type === 'pdf' || lesson.type === 'drive') {
                                embed.src = APP.utils.convertDriveLink(lesson.url);
                                embed.classList.remove('hidden');
                            } else if (lesson.type === 'video') {
                                video.src = lesson.url;
                                video.classList.remove('hidden');
                                customControls.classList.remove('hidden');
                                video.play().catch(()=>{});
                            } else {
                                // Default fallback for other links
                                embed.src = lesson.url;
                                embed.classList.remove('hidden');
                            }
                        } else {
                            const blob = await APP.db.getFile(lid);
                            const url = URL.createObjectURL(blob);
                            if (lesson.type === 'video') {
                                video.src = url;
                                video.classList.remove('hidden');
                                customControls.classList.remove('hidden');
                                video.play().catch(()=>{});
                            } else {
                                embed.src = url;
                                embed.classList.remove('hidden');
                            }
                        }
                    } catch (e) { APP.notify('Asset Error', 'error'); }
                    loader.classList.add('hidden');
                },
                course(id) {
                    const video = document.getElementById('course-video');
                    const playPauseBtn = document.getElementById('video-play-pause');
                    const seekBar = document.getElementById('video-seek-bar');
                    const currentTimeDisplay = document.getElementById('video-current-time');
                    const durationDisplay = document.getElementById('video-duration');

                    if (video) {
                        video.onloadedmetadata = () => {
                            seekBar.max = video.duration;
                            durationDisplay.textContent = APP.utils.formatTime(video.duration);
                        };

                        video.ontimeupdate = () => {
                            if (!video.seeking) {
                                seekBar.value = video.currentTime;
                                currentTimeDisplay.textContent = APP.utils.formatTime(video.currentTime);
                            }
                        };

                        video.onplay = () => {
                            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        };

                        video.onpause = () => {
                            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                        };

                        video.onended = () => {
                            if (APP.state.activeLessonId) {
                                APP.data.progress[APP.state.activeLessonId] = { completed: true };
                                APP.db.saveData();
                                // Partial reload for progress UI
                                document.querySelectorAll(`.lesson-item[data-id="${APP.state.activeLessonId}"] i`).forEach(i => {
                                    i.className = 'fas fa-check-circle text-brand-400 text-xs';
                                });
                            }
                        };

                        playPauseBtn.onclick = () => {
                            if (video.paused) video.play();
                            else video.pause();
                        };

                        seekBar.oninput = () => {
                            currentTimeDisplay.textContent = APP.utils.formatTime(seekBar.value);
                        };

                        seekBar.onchange = () => {
                            video.currentTime = seekBar.value;
                        };
                    }
                },
                deleteUser(email) {
                    if (confirm('Revoke access for this user?')) {
                        APP.data.users = APP.data.users.filter(u => u.email !== email);
                        APP.db.saveData().then(() => APP.router.handle());
                    }
                },
                importData(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            APP.data = JSON.parse(e.target.result);
                            APP.db.saveData().then(() => location.reload());
                        } catch(e) { APP.notify('Invalid JSON', 'error'); }
                    };
                    reader.readAsText(file);
                },
                clearAllData() {
                    if (confirm('DANGER: This will permanently erase ALL data, including modules, users, and uploaded files. Proceed?')) {
                        APP.db.clearAll().then(() => location.reload());
                    }
                }
            },

            notify(msg, type = 'info') {
                const div = document.createElement('div');
                const colors = type === 'success' ? 'bg-emerald-500 border-emerald-400' : type === 'error' ? 'bg-red-500 border-red-400' : 'bg-brand-500 border-brand-400';
                div.className = `fixed top-12 left-1/2 -translate-x-1/2 z-[200] px-8 py-4 rounded-2xl border-2 text-white font-bold shadow-2xl transition-all duration-500 -translate-y-20 opacity-0 ${colors}`;
                div.textContent = msg;
                document.body.appendChild(div);
                requestAnimationFrame(() => { div.classList.remove('-translate-y-20', 'opacity-0'); });
                setTimeout(() => { div.classList.add('-translate-y-20', 'opacity-0'); setTimeout(() => div.remove(), 600); }, 3000);
            },

            async init() {
                try {
                    await APP.db.init();
                    await APP.db.loadData();
                    APP.router.init();
                } catch (e) { console.error(e); }
            }
        };

        document.addEventListener('DOMContentLoaded', () => APP.init());
    </script>
</body>
</html>
